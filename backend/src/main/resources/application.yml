spring:
  config:
    import: optional:file:../.env.properties

  application:
    name: smart-incident-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_ims}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.smartims: DEBUG

server:
  port: 8080

app:
  mail:
    from: ${MAIL_FROM:no-reply@smartims.local}
  frontend:
    login-url: http://localhost:5173/login

jwt:
  secret: ${JWT_SECRET:ThisIsASecretKeyForJwtSigningMustBeAtLeast32Chars}
  expiration:
    ms: ${JWT_EXPIRATION:3600000}
